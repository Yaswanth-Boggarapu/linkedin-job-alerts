name: Probe
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - env:
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_KEY }}
        run: python probe.py 2>&1 | tail -5
      - run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add probe-result.md
          git diff --staged --quiet || git commit -m "probe"
          git push

name: Daily job scan

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE: job_digest
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_KEY }}
        run: python main.py

      - name: Persist seen state
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "state: $(date -I)"
          git push
